<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded Square App Icon Badge in Steel Slate Blue (#5d95b3) -->
  <rect width="32" height="32" rx="7" fill="#5D95B3" />

  <!-- Calculator Body -->
  <rect x="7" y="5" width="18" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Digital Display Line -->
  <line x1="10.5" y1="9.5" x2="21.5" y2="9.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Keypad Buttons Row 1 -->
  <circle cx="11.5" cy="14.5" r="1.2" fill="#FFFFFF" />
  <circle cx="16" cy="14.5" r="1.2" fill="#FFFFFF" />
  <circle cx="20.5" cy="14.5" r="1.2" fill="#FFFFFF" />

  <!-- Keypad Buttons Row 2 -->
  <circle cx="11.5" cy="18.5" r="1.2" fill="#FFFFFF" />
  <circle cx="16" cy="18.5" r="1.2" fill="#FFFFFF" />
  <line x1="20.5" y1="18.5" x2="20.5" y2="22.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

  <!-- Keypad Buttons Row 3 -->
  <circle cx="11.5" cy="22.5" r="1.2" fill="#FFFFFF" />
  <circle cx="16" cy="22.5" r="1.2" fill="#FFFFFF" />
</svg>